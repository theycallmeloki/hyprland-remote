<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>remote</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d2028; --ink: #c0caf5;
    --dim: #565f89; --accent: #7aa2f7; --red: #f7768e; --green: #9ece6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.3 system-ui, sans-serif; }
  body { padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  #status { position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
    padding: 4px 2px 8px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #dot.on { background: var(--green); } #dot.off { background: var(--red); }
  #dot.err { background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .tool { border: 0; border-radius: 8px; background: var(--panel2); color: var(--ink);
    font-size: 14px; padding: 6px 10px; }
  .tool:active { filter: brightness(1.5); }
  .overlay { position: fixed; inset: 0; background: rgba(5,6,10,.7); display: flex;
    align-items: center; justify-content: center; z-index: 10; }
  .overlay.hidden { display: none; }
  .card { width: min(92vw, 560px); max-height: 86vh; display: flex; flex-direction: column;
    background: var(--panel); border-radius: 12px; padding: 10px; gap: 8px; }
  .cardhdr { display: flex; justify-content: space-between; align-items: center;
    font-weight: 700; gap: 8px; }
  .cardhdr span { display: flex; gap: 6px; align-items: center; font-weight: 400; }
  .cardhdr input { background: var(--panel2); color: var(--ink); border: 0; border-radius: 6px;
    padding: 6px 8px; font-size: 14px; }
  .cardhdr button { border: 0; border-radius: 6px; background: var(--panel2); color: var(--ink);
    padding: 6px 10px; }
  .list { overflow-y: auto; min-height: 40vh; display: flex; flex-direction: column; gap: 2px; }
  .list button { text-align: left; border: 0; border-radius: 6px; background: transparent;
    color: var(--ink); padding: 9px 8px; font-size: 15px; }
  .list button:active { background: var(--panel2); }
  .quickkeys { display: flex; gap: 6px; }
  .quickkeys button { flex: 1; border: 0; border-radius: 6px; background: var(--panel2);
    color: var(--ink); padding: 10px; font-size: 14px; }
  .quickkeys.media button { font-size: 20px; padding: 8px; }
  .medialbl { color: var(--dim); font-size: 12px; padding: 0 2px; }
  textarea { width: 100%; box-sizing: border-box; background: var(--panel2); color: var(--ink);
    border: 0; border-radius: 8px; padding: 8px; font: 15px/1.4 ui-monospace, monospace;
    resize: vertical; min-height: 90px; }
  .send { border: 0; border-radius: 8px; background: var(--accent); color: #0f1115;
    padding: 11px; font-weight: 700; font-size: 15px; }
  #cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .col { background: var(--panel); border-radius: 10px; overflow: hidden; }
  .col.focus { box-shadow: inset 0 0 0 1px rgba(122, 162, 247, .35); }
  .hdr { display: flex; gap: 8px; align-items: center; padding: 8px 10px;
    background: var(--panel2); }
  .hdr .name { font-weight: 600; }
  .hdr .ws { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hdr button { border: 0; border-radius: 6px; background: var(--accent); color: #0f1115;
    font-weight: 700; padding: 3px 8px; }
  .wins { padding: 4px; display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
  .empty { color: var(--dim); text-align: center; padding: 14px 0; font-style: italic; }
  .win { background: var(--panel2); border-radius: 8px; padding: 7px 8px 6px;
    cursor: pointer; border: 1px solid transparent; }
  .win:active { filter: brightness(1.4); }
  .win.active { border-color: var(--accent); background: rgba(122, 162, 247, .10); }
  .win .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .m { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 1px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; min-height: 34px; border: 0; border-radius: 6px; background: var(--panel);
    color: var(--ink); font-size: 15px; }
  .row button:disabled { opacity: .25; }
  .row button:active { filter: brightness(1.5); }
  .row button.danger { color: var(--red); }
  .row button.big { flex: 2; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
  <div id="status"><span id="dot"></span><span id="err"></span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button id="btnApps" class="tool">apps</button>
      <button id="btnKeys" class="tool">⌨</button>
    </span>
  </div>
  <div id="cols"></div>

  <div id="sheet" class="overlay hidden">
    <div class="card">
      <div class="cardhdr">launch<span><input id="appFilter" placeholder="filter…"><button id="closeApps">✕</button></span></div>
      <div id="appList" class="list"></div>
    </div>
  </div>

  <div id="keys" class="overlay hidden">
    <div class="card">
      <div class="cardhdr">type into focused window<span><button id="closeKeys">✕</button></span></div>
      <div class="quickkeys">
        <button data-key="esc">esc</button><button data-key="tab">tab</button><button data-key="space">space</button><button data-key="enter">↵</button>
      </div>
      <div class="medialbl">media <span id="mediaName" style="color:var(--dim)"></span></div>
      <div class="quickkeys media">
        <button data-ma="prev">⏮</button><button data-ma="playpause">⏯</button><button data-ma="next">⏭</button>
      </div>
      <textarea id="typeBox" rows="4" placeholder="text to type…"></textarea>
      <button id="sendType" class="send">send</button>
    </div>
  </div>

<script>
const TOKEN = new URL(location.href).searchParams.get("t") ?? "";
const q = (p) => fetch(p + (TOKEN ? (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN) : ""),
  { headers: { "x-token": TOKEN } });

const dot = document.getElementById("dot");
const err = document.getElementById("err");

function send(op, args = {}) {
  return fetch("/api/action" + (TOKEN ? "?t=" + encodeURIComponent(TOKEN) : ""), {
    method: "POST", headers: { "content-type": "application/json", "x-token": TOKEN },
    body: JSON.stringify({ op, ...args }),
  }).then(async (r) => {
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(state) {
  const cols = document.getElementById("cols");
  const mons = state.monitors;
  const byMon = new Map(mons.map((m) => [m.id, []]));
  for (const c of state.clients) {
    if (!byMon.has(c.monitor)) byMon.set(c.monitor, []);
    byMon.get(c.monitor).push(c);
  }
  cols.innerHTML = mons.map((m, i) => {
    const left = i > 0 ? mons[i - 1] : null;
    const right = i < mons.length - 1 ? mons[i + 1] : null;
    const wins = byMon.get(m.id) ?? [];
    const body = wins.length
      ? wins.map((c) => {
          const active = c.address === state.focused;
          return `<div class="win${active ? " active" : ""}" data-a="${c.address}">
            <div class="t">${esc(c.title || c.class)}</div>
            <div class="m">${esc(c.class)}${c.floating ? " · float" : ""}${c.fullscreen ? " · full" : ""}</div>
            <div class="row">
              <button ${left ? "" : "disabled"} data-a="${c.address}" data-op="moveWindow" data-mon="${left?.name ?? ""}" title="to ${left?.name ?? ""}">◂</button>
              <button class="big" data-a="${c.address}" data-op="focusWindow">focus</button>
              <button ${right ? "" : "disabled"} data-a="${c.address}" data-op="moveWindow" data-mon="${right?.name ?? ""}" title="to ${right?.name ?? ""}">▸</button>
              <button data-a="${c.address}" data-op="fullscreen" title="fullscreen">⛶</button>
              <button data-a="${c.address}" data-op="float" title="float">⤢</button>
              <button class="danger" data-a="${c.address}" data-op="close" title="close">✕</button>
            </div>
          </div>`;
        }).join("")
      : `<div class="empty">no windows</div>`;
    return `<div class="col${m.focused ? " focus" : ""}">
      <div class="hdr"><span class="name">${esc(m.name)}</span>
        <button data-op="focusMonitor" data-mon="${esc(m.name)}">focus</button>
        <span class="ws">ws ${m.ws}</span></div>
      <div class="wins">${body}</div></div>`;
  }).join("");

  const act = async (op, args) => {
    try {
      await send(op, args);
      await refresh();
    } catch (err2) { err.textContent = "failed: " + (err2.message || err2); }
  };
  for (const b of cols.querySelectorAll("button")) {
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const mon = b.dataset.mon, a = b.dataset.a, op = b.dataset.op;
      b.disabled = true;
      await act(op, op === "moveWindow" ? { address: a, monitor: mon }
        : op === "focusMonitor" ? { name: mon } : { address: a });
    });
  }
  // Tap anywhere on a window card to focus it (buttons above swallow their
  // own taps via stopPropagation).
  for (const card of cols.querySelectorAll(".win")) {
    card.addEventListener("click", async () => {
      await act("focusWindow", { address: card.dataset.a });
    });
  }
}

async function refresh() {
  try {
    const r = await q("/api/state");
    if (!r.ok) throw 0;
    const s = await r.json();
    dot.className = "on"; err.textContent = "";
    render(s);
  } catch {
    dot.className = "off"; err.textContent = "no connection";
  }
}

// --- apps sheet --------------------------------------------------------------

const sheet = document.getElementById("sheet");
const appList = document.getElementById("appList");
const appFilter = document.getElementById("appFilter");
let ALL_APPS = [];

async function loadApps(filter = "") {
  try {
    const r = await q("/api/apps");
    ALL_APPS = await r.json();
  } catch { ALL_APPS = []; }
  const f = filter.toLowerCase();
  appList.innerHTML = ALL_APPS.filter((a) => !f || a.name.toLowerCase().includes(f) || a.id.toLowerCase().includes(f))
    .map((a) => `<button data-id="${esc(a.id)}">${esc(a.name)}</button>`).join("") || '<div class="empty">no matches</div>';
  for (const b of appList.querySelectorAll("button")) {
    b.addEventListener("click", async () => {
      try { await send("launch", { id: b.dataset.id }); sheet.classList.add("hidden"); }
      catch (e) { err.textContent = "failed: " + (e.message || e); }
    });
  }
}

document.getElementById("btnApps").addEventListener("click", async () => {
  sheet.classList.remove("hidden");
  appFilter.value = "";
  await loadApps();
  appFilter.focus();
});
document.getElementById("closeApps").addEventListener("click", () => sheet.classList.add("hidden"));
appFilter.addEventListener("input", () => loadApps(appFilter.value));

// --- keyboard -----------------------------------------------------------------

const keysEl = document.getElementById("keys");
const typeBox = document.getElementById("typeBox");

document.getElementById("btnKeys").addEventListener("click", () => {
  keysEl.classList.remove("hidden");
  typeBox.focus();
});
document.getElementById("closeKeys").addEventListener("click", () => keysEl.classList.add("hidden"));
for (const b of keysEl.querySelectorAll(".quickkeys button")) {
  b.addEventListener("click", async () => {
    try { await send("key", { key: b.dataset.key }); }
    catch (e) { err.textContent = "failed: " + (e.message || e); }
  });
}
const mediaName = document.getElementById("mediaName");
for (const b of keysEl.querySelectorAll(".quickkeys.media button")) {
  b.addEventListener("click", async () => {
    try {
      const r = await q("/api/media");
      const players = (await r.json()).players || [];
      if (!players.length) throw new Error("no media player running");
      const player = players[0];
      mediaName.textContent = player.replace("org.mpris.MediaPlayer2.", "");
      await send("media", { player, action: b.dataset.ma });
    } catch (e) { err.textContent = "failed: " + (e.message || e); }
  });
}
document.getElementById("sendType").addEventListener("click", async () => {
  const text = typeBox.value;
  if (!text) return;
  try { await send("type", { text }); typeBox.value = ""; }
  catch (e) { err.textContent = "failed: " + (e.message || e); }
});

refresh();
setInterval(refresh, 1200);
</script>
</body>
</html>
