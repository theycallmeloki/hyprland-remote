<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>remote</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d2028; --ink: #c0caf5;
    --dim: #565f89; --accent: #7aa2f7; --red: #f7768e; --green: #9ece6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.3 system-ui, sans-serif; }
  body { padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  #status { position: sticky; top: 0; display: flex; gap: 8px; align-items: center;
    padding: 4px 2px 8px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  #dot.on { background: var(--green); } #dot.off { background: var(--red); }
  #dot.err { background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
  .col { background: var(--panel); border-radius: 10px; overflow: hidden; }
  .col.focus { outline: 2px solid var(--accent); }
  .hdr { display: flex; gap: 8px; align-items: center; padding: 8px 10px;
    background: var(--panel2); }
  .hdr .name { font-weight: 600; }
  .hdr .ws { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hdr button { border: 0; border-radius: 6px; background: var(--accent); color: #0f1115;
    font-weight: 700; padding: 3px 8px; }
  .wins { padding: 4px; display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
  .empty { color: var(--dim); text-align: center; padding: 14px 0; font-style: italic; }
  .win { background: var(--panel2); border-radius: 8px; padding: 7px 8px 6px; }
  .win.active { outline: 1px solid var(--accent); }
  .win .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .m { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-top: 1px; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; min-height: 34px; border: 0; border-radius: 6px; background: var(--panel);
    color: var(--ink); font-size: 15px; }
  .row button:disabled { opacity: .25; }
  .row button:active { filter: brightness(1.5); }
  .row button.danger { color: var(--red); }
  .row button.big { flex: 2; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
  <div id="status"><span id="dot"></span><span id="err"></span></div>
  <div id="cols"></div>

<script>
const TOKEN = new URL(location.href).searchParams.get("t") ?? "";
const q = (p) => fetch(p + (TOKEN ? (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN) : ""),
  { headers: { "x-token": TOKEN } });

const dot = document.getElementById("dot");
const err = document.getElementById("err");

function send(op, args = {}) {
  return fetch("/api/action" + (TOKEN ? "?t=" + encodeURIComponent(TOKEN) : ""), {
    method: "POST", headers: { "content-type": "application/json", "x-token": TOKEN },
    body: JSON.stringify({ op, ...args }),
  }).then(async (r) => {
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(state) {
  const cols = document.getElementById("cols");
  const mons = state.monitors;
  const byMon = new Map(mons.map((m) => [m.id, []]));
  for (const c of state.clients) {
    if (!byMon.has(c.monitor)) byMon.set(c.monitor, []);
    byMon.get(c.monitor).push(c);
  }
  cols.innerHTML = mons.map((m, i) => {
    const left = i > 0 ? mons[i - 1] : null;
    const right = i < mons.length - 1 ? mons[i + 1] : null;
    const wins = byMon.get(m.id) ?? [];
    const body = wins.length
      ? wins.map((c) => {
          const active = c.address === state.focused;
          return `<div class="win${active ? " active" : ""}">
            <div class="t">${esc(c.title || c.class)}</div>
            <div class="m">${esc(c.class)}${c.floating ? " · float" : ""}${c.fullscreen ? " · full" : ""}</div>
            <div class="row">
              <button ${left ? "" : "disabled"} data-a="${c.address}" data-op="moveWindow" data-mon="${left?.name ?? ""}" title="to ${left?.name ?? ""}">◂</button>
              <button class="big" data-a="${c.address}" data-op="focusWindow">focus</button>
              <button ${right ? "" : "disabled"} data-a="${c.address}" data-op="moveWindow" data-mon="${right?.name ?? ""}" title="to ${right?.name ?? ""}">▸</button>
              <button data-a="${c.address}" data-op="fullscreen" title="fullscreen">⛶</button>
              <button data-a="${c.address}" data-op="float" title="float">⤢</button>
              <button class="danger" data-a="${c.address}" data-op="close" title="close">✕</button>
            </div>
          </div>`;
        }).join("")
      : `<div class="empty">no windows</div>`;
    return `<div class="col${m.focused ? " focus" : ""}">
      <div class="hdr"><span class="name">${esc(m.name)}</span>
        <button data-op="focusMonitor" data-mon="${esc(m.name)}">focus</button>
        <span class="ws">ws ${m.ws}</span></div>
      <div class="wins">${body}</div></div>`;
  }).join("");

  for (const b of cols.querySelectorAll("button")) {
    b.addEventListener("click", async (e) => {
      e.stopPropagation();
      const mon = b.dataset.mon, a = b.dataset.a, op = b.dataset.op;
      b.disabled = true;
      try {
        await send(op, op === "moveWindow" ? { address: a, monitor: mon }
          : op === "focusMonitor" ? { name: mon } : { address: a });
        await refresh();
      } catch (err2) { err.textContent = "failed: " + (err2.message || err2); }
    });
  }
}

async function refresh() {
  try {
    const r = await q("/api/state");
    if (!r.ok) throw 0;
    const s = await r.json();
    dot.className = "on"; err.textContent = "";
    render(s);
  } catch {
    dot.className = "off"; err.textContent = "no connection";
  }
}

refresh();
setInterval(refresh, 1200);
</script>
</body>
</html>
